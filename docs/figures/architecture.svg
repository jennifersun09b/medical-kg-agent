<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c65a5a"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1f2933; }
      .lane { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #7b8794; }
      .box-title { font-size: 15px; font-weight: 700; fill: #1f2933; }
      .t { font-size: 13px; fill: #52606d; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #323f4b; }
      .edge { stroke: #5b6472; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #c65a5a; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-loop); }
      .edge-label { font-size: 12px; fill: #5b6472; }
      .loop-label { font-size: 12px; font-weight: 700; fill: #c65a5a; }
    </style>
  </defs>

  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="40" y="44" class="title">Build the graph · ground the answers · measure · repeat</text>

  <!-- ============ 1. Inputs ============ -->
  <rect x="40" y="70" width="1020" height="100" rx="10" fill="#fff8e6" stroke="#f0c36d"/>
  <text x="56" y="90" class="lane">1 · INPUTS</text>
  <rect x="60" y="100" width="230" height="56" rx="6" fill="#ffffff" stroke="#f0c36d"/>
  <text x="175" y="123" text-anchor="middle" class="box-title">Authoritative sources</text>
  <text x="175" y="143" text-anchor="middle" class="t">labels · guidelines · trials</text>
  <rect x="306" y="100" width="230" height="56" rx="6" fill="#ffffff" stroke="#f0c36d"/>
  <text x="421" y="123" text-anchor="middle" class="box-title">Benchmark</text>
  <text x="421" y="143" text-anchor="middle" class="t">246 patient questions · rubrics</text>
  <rect x="552" y="100" width="488" height="56" rx="6" fill="#ffffff" stroke="#f0c36d"/>
  <text x="796" y="123" text-anchor="middle" class="box-title">Six LLM platforms</text>
  <text x="796" y="143" text-anchor="middle" class="t">API access, or RPA-driven web chat where no API exists</text>

  <!-- ============ 2. KB construction ============ -->
  <rect x="40" y="200" width="500" height="170" rx="10" fill="#eef4ff" stroke="#9db8f0"/>
  <text x="56" y="220" class="lane">2 · KNOWLEDGE CONSTRUCTION</text>
  <text x="524" y="220" text-anchor="end" class="code">kb_builder/</text>
  <rect x="60" y="236" width="140" height="60" rx="6" fill="#ffffff" stroke="#9db8f0"/>
  <text x="130" y="262" text-anchor="middle" class="box-title">Extract</text>
  <text x="130" y="282" text-anchor="middle" class="t">PDF · Word · Excel</text>
  <rect x="216" y="236" width="150" height="60" rx="6" fill="#ffffff" stroke="#9db8f0"/>
  <text x="291" y="262" text-anchor="middle" class="box-title">Normalise · relate</text>
  <text x="291" y="282" text-anchor="middle" class="t">entities · typed edges</text>
  <rect x="382" y="236" width="138" height="60" rx="6" fill="#ffffff" stroke="#9db8f0"/>
  <text x="451" y="262" text-anchor="middle" class="box-title">Validate</text>
  <text x="451" y="282" text-anchor="middle" class="t">quality · citations</text>
  <path d="M 200 266 L 214 266" class="edge"/>
  <path d="M 366 266 L 380 266" class="edge"/>
  <text x="60" y="324" class="t">Agent workflow with two human review checkpoints.</text>
  <text x="60" y="346" class="t">Every number is a claim with a verified source.</text>

  <!-- ============ 3. Knowledge graph ============ -->
  <rect x="560" y="200" width="500" height="170" rx="10" fill="#f3ecfb" stroke="#b79ae0"/>
  <text x="576" y="220" class="lane">3 · KNOWLEDGE GRAPH</text>
  <text x="1044" y="220" text-anchor="end" class="code">entities · relations · evidence</text>
  <rect x="580" y="236" width="220" height="60" rx="6" fill="#ffffff" stroke="#b79ae0"/>
  <text x="690" y="262" text-anchor="middle" class="box-title">123 nodes · 27 types</text>
  <text x="690" y="282" text-anchor="middle" class="t">drug · regimen · test · claim</text>
  <rect x="820" y="236" width="220" height="60" rx="6" fill="#ffffff" stroke="#b79ae0"/>
  <text x="930" y="262" text-anchor="middle" class="box-title">161 edges · 44 types</text>
  <text x="930" y="282" text-anchor="middle" class="t">incl. safety constraints</text>
  <text x="580" y="324" class="t">Safety rules are relationships, not prose:</text>
  <text x="580" y="346" class="code">requires_emergency_action · must_not_self_adjust · …</text>

  <!-- ============ 4. Evaluation ============ -->
  <rect x="40" y="400" width="1020" height="150" rx="10" fill="#eafaf1" stroke="#7fcf9f"/>
  <text x="56" y="420" class="lane">4 · GROUNDED ANSWERING AND PAIRED A/B EVALUATION</text>
  <text x="1044" y="420" text-anchor="end" class="code">kb_ab_eval/ · model_eval/ · rpa_collection/</text>
  <rect x="60" y="436" width="230" height="96" rx="6" fill="#ffffff" stroke="#7fcf9f"/>
  <text x="70" y="460" class="box-title">Retrieve</text>
  <text x="70" y="482" class="t">BM25 over nodes, aliases and</text>
  <text x="70" y="500" class="t">neighbour edges · safety boost</text>
  <text x="70" y="522" class="code">KBRetriever.search()</text>
  <rect x="306" y="436" width="230" height="96" rx="6" fill="#ffffff" stroke="#7fcf9f"/>
  <text x="316" y="460" class="box-title">Answer, two arms</text>
  <text x="316" y="482" class="t">baseline prompt vs safety rules</text>
  <text x="316" y="500" class="t">+ rubric anchors + KB evidence</text>
  <text x="316" y="522" class="code">answer_system_zh.md</text>
  <rect x="552" y="436" width="230" height="96" rx="6" fill="#ffffff" stroke="#7fcf9f"/>
  <text x="562" y="460" class="box-title">Judge independently</text>
  <text x="562" y="482" class="t">6 dimensions · 5 red lines</text>
  <text x="562" y="500" class="t">separate model, hidden rubric</text>
  <text x="562" y="522" class="code">judge_system_zh.md</text>
  <rect x="798" y="436" width="242" height="96" rx="6" fill="#ffffff" stroke="#7fcf9f"/>
  <text x="808" y="460" class="box-title">Report</text>
  <text x="808" y="482" class="t">paired deltas per dimension</text>
  <text x="808" y="500" class="t">SHA-256 manifest · resumable</text>
  <text x="808" y="522" class="code">paired_results.jsonl</text>
  <path d="M 290 484 L 304 484" class="edge"/>
  <path d="M 536 484 L 550 484" class="edge"/>
  <path d="M 782 484 L 796 484" class="edge"/>

  <!-- ============ arrows ============ -->
  <path d="M 175 156 L 175 198" class="edge"/>
  <path d="M 540 300 L 558 300" class="edge"/>
  <path d="M 421 156 L 421 184 L 550 184 L 550 398" class="edge"/>
  <text x="556" y="392" class="edge-label">questions</text>
  <path d="M 796 156 L 796 184 L 1074 184 L 1074 380 L 1030 380 L 1030 398" class="edge"/>
  <text x="1024" y="392" text-anchor="end" class="edge-label">answers</text>
  <path d="M 700 370 L 700 398" class="edge"/>
  <text x="708" y="392" class="edge-label">top-k evidence</text>

  <!-- feedback loop -->
  <path d="M 40 484 L 22 484 L 22 336 L 58 336" class="loop"/>
  <text x="40" y="582" class="loop-label">Defect-driven loop</text>
  <text x="40" y="602" class="t">Scored results are aggregated into a defect profile: which questions fail, on which dimension, on every model.</text>
  <text x="40" y="620" class="t">The profile sets the next knowledge batch, and the validator checks that the new entries close the measured gaps.</text>
</svg>
